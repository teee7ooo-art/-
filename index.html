<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطافي الجيزة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f7;color:#17202a}.header{background:#12395b;color:#fff;padding:15px;text-align:center}.header h1{margin:0;font-size:23px}.header p{margin:6px 0 0}.container{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #bbb}label{display:block;font-weight:bold;margin:7px 0}select,input{width:100%;padding:13px;border:1px solid #aaa;border-radius:8px;font-size:16px;background:#fff}button{width:100%;border:0;border-radius:9px;padding:13px;font-size:16px;font-weight:bold;color:#fff;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.blue{background:#125a91}.green{background:#168447}.red{background:#b51f25}.orange{background:#d87900}.dark{background:#263746}.mapbox{height:420px;border-radius:10px;overflow:hidden;border:1px solid #aaa;background:#ddd}.mapbox iframe{width:100%;height:100%;border:0}.info{background:#f5f8fa;border-right:5px solid #125a91;padding:10px;margin-top:10px;line-height:1.9}.status{text-align:center;font-weight:bold;padding:9px}.footer{text-align:center;color:#666;padding:12px;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.mapbox{height:390px}}
</style>
</head>
<body>
<div class="header"><h1>🚒 مطافي الجيزة</h1><p>توجيه سيارات الإطفاء إلى موقع البلاغ</p></div>
<div class="container">
<div class="card">
<label>نقطة / محطة الانطلاق</label>
<select id="station"><option value="">اختر نقطة المطافي</option></select>
<label>عنوان البلاغ</label>
<input id="address" type="text" placeholder="اكتب الشارع أو المكان أو اسم المنشأة">
<div class="grid">
<button class="blue" onclick="showIncident()">📍 تحديد البلاغ</button>
<button class="green" onclick="myLocation()">📡 موقعي الحالي</button>
<button class="dark" onclick="loadLast()">💾 آخر بلاغ</button>
<button class="red" onclick="call180()">☎️ طوارئ 180</button>
</div>
</div>
<div class="card">
<div class="mapbox"><iframe id="mapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=31.0%2C29.8%2C31.5%2C30.3&layer=mapnik" loading="lazy"></iframe></div>
<div id="status" class="status">جاهز لاستقبال البلاغ</div>
<div id="info" class="info">اكتب عنوان البلاغ ثم اضغط «موقعي الحالي» أو «فتح المسار في Google Maps».</div>
</div>
<div class="card">
<div class="grid">
<button class="blue" onclick="openRoute()">🗺️ فتح المسار في Google Maps</button>
<button class="green" onclick="shareWhatsApp()">📱 مشاركة واتساب</button>
<button class="orange" onclick="saveReport(true)">💾 حفظ البلاغ</button>
<button class="dark" onclick="printReport()">🖨️ طباعة البلاغ</button>
</div>
</div>
</div>
<div class="footer">مطافي الجيزة 🚒 — نظام توجيه البلاغات</div>
<script>
var stations=["الدقي","العجوزة","امبابة","شمال الجيزة","الدقي - امام السفارة السعودية","محولات غرب","الوراق","بشتيل","المنيرة الغربية","المصل واللقاح","أوسيم","إدارة الغرب الاستديو","الطالبية","العمرانية","جامعة القاهرة","المنيب الجديدة","المنيب القديمة","منشاة البكاري","أبو الهول","المتحف","همدان","بولاق الدكرور","حدائق الاهرام","الواحات","أبو النمرس","الحوامدية","البدرشين","الشهيد","العياط","القطوري","الصف","أطفيح","المنوات","البرميل","صول","القبابات","السادس","السابع","الحادى عشر","سوزوكي","المنشات","اكتوبر","سوق الجملة","المتميز","الامن","الصناعية","ذايد الاول","الشيخ زايد الحي الاول","حدائق اكتوبر","أبو رواش","موبيكا","التقل الخفيف","المنصورية","أبو غالب","بني سلامة","وردان","المناشي","البويطي","منديشة","ك 56 السلمانية","كرداسة","اوسيم مركز"];

var sel=document.getElementById("station");
var mapFrame=document.getElementById("mapFrame");
var statusBox=document.getElementById("status");
var info=document.getElementById("info");

var report={
    station:"",
    address:"",
    myLat:null,
    myLon:null,
    usingMyLocation:false,
    date:""
};

stations.forEach(function(s){
    var o=document.createElement("option");
    o.value=s;
    o.textContent=s;
    sel.appendChild(o);
});

function setStatus(t){
    statusBox.textContent=t;
}

function mapsSearch(q){
    return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
}

function routeUrl(origin,destination){
    var u="https://www.google.com/maps/dir/?api=1"+
           "&destination="+encodeURIComponent(destination)+
           "&travelmode=driving";
    if(origin){
        u+="&origin="+encodeURIComponent(origin);
    }
    return u;
}

/* فتح Google Maps بدون طلب GPS من ملف HTML */
function openGoogleMapsForCurrentLocation(destination){
    return "https://www.google.com/maps/dir/?api=1"+
           "&destination="+encodeURIComponent(destination)+
           "&travelmode=driving";
}
function saveState(){
    localStorage.setItem("lastFireReport",JSON.stringify(report));
}

/* تحديد البلاغ: لا يشترط اختيار محطة */
function showIncident(){

    var a=document.getElementById("address").value.trim();

    if(!a){
        alert("اكتب عنوان البلاغ أولاً");
        return;
    }

    report.address=a;

    if(report.myLat!==null && report.myLon!==null){
        report.usingMyLocation=true;
    }

    if(sel.value.trim() && !report.usingMyLocation){
        report.station=sel.value.trim();
    }

    mapFrame.src=mapsSearch(a+" الجيزة مصر");

    setStatus("تم تحديد عنوان البلاغ");

    var startText=report.usingMyLocation
        ? "موقعي الحالي"
        : (report.station || "لم يتم تحديد نقطة انطلاق");

    info.innerHTML=
        "<b>🚨 البلاغ</b><br>"+
        "<b>نقطة الانطلاق:</b> "+esc(startText)+"<br>"+
        "<b>العنوان:</b> "+esc(a)+"<br><br>"+
        "اضغط «فتح المسار في Google Maps» لبدء الطريق.";

    saveState();
}

/* موقعي الحالي */
function myLocation(){

    /*
      ملاحظة مهمة:
      الملف يعمل كـ file:// على الهاتف، ولذلك Chrome قد يمنع
      navigator.geolocation حتى لو إذن الموقع في Chrome مفعّل.
      لذلك لا نعتمد على GPS داخل ملف HTML.
      Google Maps نفسه سيستخدم موقع الهاتف عند فتح المسار.
    */

    var a=document.getElementById("address").value.trim();

    if(!a){
        setStatus("📍 اكتب عنوان البلاغ أولاً");
        alert("اكتب عنوان البلاغ أولاً، ثم اضغط «موقعي الحالي».");
        return;
    }

    report.address=a;
    report.usingMyLocation=true;
    report.myLat=null;
    report.myLon=null;

    saveState();

    setStatus("📡 جاري فتح Google Maps باستخدام موقع الهاتف...");

    var u=openGoogleMapsForCurrentLocation(a+", الجيزة مصر");

    window.location.href=u;
}
/* استخدام نقطة من القائمة */
function useStation(){

    var s=sel.value.trim();

    if(!s){
        alert("اختر نقطة المطافي أولاً");
        return;
    }

    report.station=s;
    report.usingMyLocation=false;
    report.myLat=null;
    report.myLon=null;

    setStatus("🚒 تم اختيار نقطة المطافي");

    info.innerHTML=
        "<b>🚒 نقطة الانطلاق:</b> "+esc(s)+
        "<br><br>اكتب عنوان البلاغ ثم اضغط «تحديد البلاغ» أو «فتح المسار».";

    saveState();
}

/* المسار */
function openRoute(){

    var a=document.getElementById("address").value.trim();

    if(!a){
        alert("اكتب عنوان البلاغ أولاً");
        return;
    }

    report.address=a;
    saveState();

    /*
      لو عندنا إحداثيات محفوظة نستخدمها.
      وإلا نترك Google Maps يحدد موقع الهاتف بنفسه.
    */
    var u;

    if(report.myLat!==null && report.myLon!==null){
        u=routeUrl(
            report.myLat+","+report.myLon,
            a+", الجيزة مصر"
        );
    }
    else if(sel.value.trim()){
        report.station=sel.value.trim();
        u=routeUrl(
            sel.value.trim()+", الجيزة مصر",
            a+", الجيزة مصر"
        );
    }
    else if(report.station){
        u=routeUrl(
            report.station+", الجيزة مصر",
            a+", الجيزة مصر"
        );
    }
    else{
        u=openGoogleMapsForCurrentLocation(a+", الجيزة مصر");
    }

    setStatus("🗺️ جاري فتح Google Maps...");

    window.location.href=u;
}
/* واتساب */
function shareWhatsApp(){

    var a=document.getElementById("address").value.trim();

    if(!a){
        alert("اكتب عنوان البلاغ أولاً");
        return;
    }

    var startText="";
    var u="";

    if(report.myLat!==null && report.myLon!==null){
        startText="موقعي الحالي";
        u=routeUrl(
            report.myLat+","+report.myLon,
            a+", الجيزة مصر"
        );
    }
    else if(sel.value.trim()){
        startText=sel.value.trim();
        u=routeUrl(
            sel.value.trim()+", الجيزة مصر",
            a+", الجيزة مصر"
        );
    }
    else if(report.station){
        startText=report.station;
        u=routeUrl(
            report.station+", الجيزة مصر",
            a+", الجيزة مصر"
        );
    }
    else{
        startText="موقعي الحالي";
        u=openGoogleMapsForCurrentLocation(a+", الجيزة مصر");
    }

    var text=
        "🚨 بلاغ طوارئ مطافي 🚒\n\n"+
        "نقطة الانطلاق: "+startText+"\n"+
        "عنوان البلاغ: "+a+"\n\n"+
        "🗺️ فتح المسار:\n"+u;

    saveState();

    window.location.href=
        "https://wa.me/?text="+encodeURIComponent(text);
}
/* حفظ */
function saveReport(show){

    var a=document.getElementById("address").value.trim();

    if(!a){
        if(show) alert("اكتب عنوان البلاغ أولاً");
        return;
    }

    report.address=a;
    report.station=sel.value.trim();
    report.date=new Date().toLocaleString("ar-EG");

    saveState();

    if(show)
        alert("✅ تم حفظ آخر بلاغ بنجاح");
}

/* آخر بلاغ */
function loadLast(){

    var x=localStorage.getItem("lastFireReport");

    if(!x){
        alert("لا يوجد بلاغ محفوظ");
        return;
    }

    try{

        var r=JSON.parse(x);
        report=r;

        sel.value=r.station||"";
        document.getElementById("address").value=r.address||"";

        setStatus("💾 تم استرجاع آخر بلاغ");

        var startText=
            r.usingMyLocation
            ? "موقعي الحالي"
            : (r.station||"غير محدد");

        info.innerHTML=
            "<b>💾 آخر بلاغ</b><br>"+
            "<b>نقطة الانطلاق:</b> "+esc(startText)+"<br>"+
            "<b>العنوان:</b> "+esc(r.address||"")+"<br>"+
            "<b>التاريخ:</b> "+esc(r.date||"");

    }catch(e){
        alert("بيانات البلاغ المحفوظ غير صالحة");
    }
}

/* طباعة */
function printReport(){

    var a=document.getElementById("address").value.trim();

    if(!a){
        alert("اكتب عنوان البلاغ أولاً");
        return;
    }

    var startText=
        (report.myLat!==null && report.myLon!==null)
        ? "موقعي الحالي"
        : (sel.value.trim() || report.station || "غير محدد");

    var w=window.open("","_blank");

    if(!w){
        alert("المتصفح منع نافذة الطباعة.");
        return;
    }

    w.document.write(
        '<html lang="ar" dir="rtl">'+
        '<head><meta charset="UTF-8">'+
        '<title>بلاغ طوارئ مطافي</title>'+
        '<style>'+
        'body{font-family:Tahoma;padding:30px}'+
        'h1{text-align:center}'+
        '.box{border:1px solid #333;padding:20px;line-height:2}'+
        '</style></head><body>'+
        '<h1>🚒 بلاغ طوارئ مطافي</h1>'+
        '<div class="box">'+
        '<b>نقطة الانطلاق:</b> '+esc(startText)+
        '<br><b>عنوان البلاغ:</b> '+esc(a)+
        '<br><b>التاريخ:</b> '+new Date().toLocaleString("ar-EG")+
        '</div></body></html>'
    );

    w.document.close();
    w.focus();

    setTimeout(function(){
        w.print();
    },500);
}

/* اتصال 180 */
function call180(){
    window.location.href="tel:180";
}

function esc(x){
    return String(x).replace(/[&<>"']/g,function(c){
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c];
    });
}
</script>
</body>
</html>
