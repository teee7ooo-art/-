<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a2a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مطافي الجيزة">
<link rel="manifest" href="./manifest.webmanifest">
<title>مطافي الجيزة 62 نقطة 🚒</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { min-height: 100%; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
button, select, input { -webkit-appearance: none; appearance: none; }
button { cursor: pointer; touch-action: manipulation; }
#map { touch-action: pan-x pan-y; }

body { font-family: Arial; background: #0a2a66; padding: 10px; text-align: center; margin:0; color:white; }
.container { background: white; padding: 12px; border-radius: 15px; border: 3px solid #d4af37; color:black; }
h1 { color: #d32f2f; font-size: 20px; margin:5px 0; }
select, input { width: 95%; padding: 10px; margin: 8px 0; font-size: 15px; border: 2px solid #d4af37; border-radius: 8px; }
button { background: #d32f2f; color: white; padding: 12px; width: 95%; border: none; border-radius: 8px; font-size: 16px; margin: 4px 0; font-weight: bold; }
.btn-green { background: #25D366; }
.btn-blue { background: #0a2a66; }
.btn-orange { background: #ff9800; color:black; }
label { font-weight: bold; color: #0a2a66; font-size: 15px; }
#map { height: min(55vh, 500px); min-height: 320px; width: 100%; border-radius: 10px; margin-top: 8px; border:2px solid #d4af37; cursor: crosshair; }
#result { text-align:right; margin-top:8px; font-size:14px; background:#f5f5f5; padding:8px; border-radius:8px; display:none; max-height:200px; overflow-y:auto;}
.distance-label { background: yellow; padding: 3px 6px; border-radius: 5px; font-size: 12px; font-weight: bold; border:2px solid red; color:red; }
.note { background: #fff3cd; padding:8px; border-radius:8px; color:black; font-size:13px; margin:8px 0;}
</style>
</head>
<body>
<div class="container">
<h1>🚒 عمليات مطافي الجيزة - 62 نقطة</h1>

<label>1. نقطة الاطفاء</label>
<select id="management"></select>

<label>2. عنوان البلاغ</label>
<input type="text" id="address" placeholder="مثال: العشرين فيصل الجيزة">
<button type="button" class="btn-orange" onclick="searchAddress()">📍 ابحث وارسم الخطوط</button>

<div class="note">او دوس على الخريطة تحت عشان تحدد المكان<br>📱 يعمل على iPhone وSafari ويحتاج اتصال بالإنترنت</div>

<button type="button" onclick="showRoute()">عرض المسار في جوجل</button>
<button type="button" class="btn-blue" onclick="showAllHydrants()">📍 اظهار كل النقاط</button>
<button type="button" class="btn-green" onclick="shareWhatsApp()">مشاركة واتساب</button>

<div id="map"></div>
<div id="result"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// الـ 62 نقطة من الصور
const hydrants = [
{ name: "الدقي" },{ name: "العجوزة" },{ name: "امبابة" },{ name: "شمال الجيزة" },{ name: "الدقي - امام السفارة السعودية" },
{ name: "محولات غرب" },{ name: "الوراق" },{ name: "بشتيل" },{ name: "المنيرة الغربية" },{ name: "المصل واللقاح" },
{ name: "أوسيم" },{ name: "إدارة الغرب الاستديو" },{ name: "الطالبية" },{ name: "العمرانية" },{ name: "جامعة القاهرة" },
{ name: "المنيب الجديدة" },{ name: "المنيب القديمة" },{ name: "منشاة البكاري" },{ name: "أبو الهول" },{ name: "المتحف" },
{ name: "همدان" },{ name: "بولاق الدكرور" },{ name: "حدائق الاهرام" },{ name: "الواحات" },{ name: "أبو النمرس" },
{ name: "الحوامدية" },{ name: "البدرشين" },{ name: "الشهيد" },{ name: "العياط" },{ name: "القطوري" },
{ name: "الصف" },{ name: "أطفيح" },{ name: "المنوات" },{ name: "البرميل" },{ name: "صول" },
{ name: "القبابات" },{ name: "السادس" },{ name: "السابع" },{ name: "الحادى عشر" },{ name: "سوزوكي" },
{ name: "المنشات" },{ name: "اكتوبر" },{ name: "سوق الجملة" },{ name: "المتميز" },{ name: "الامن" },
{ name: "الصناعية" },{ name: "ذايد الاول" },{ name: "الشيخ زايد الحي الاول" },{ name: "حدائق اكتوبر" },{ name: "أبو رواش" },
{ name: "موبيكا" },{ name: "التقل الخفيف" },{ name: "المنصورية" },{ name: "أبو غالب" },{ name: "بني سلامة" },
{ name: "وردان" },{ name: "المناشي" },{ name: "البويطي" },{ name: "منديشة" },{ name: "ك 56 السلمانية" },
{ name: "كرداسة" },{ name: "اوسيم مركز" }
];

let map, lastRouteLink = "", incidentMarker, drawnItems = [], incidentLat, incidentLng;
const hydrantIcon = L.divIcon({ html: '🧯', className: '', iconSize: [28, 28] });
const incidentIcon = L.divIcon({ html: '🔥', className: '', iconSize: [35, 35] });

window.onload = function() {
    let select = document.getElementById('management');
    hydrants.forEach(h => {
        let option = document.createElement('option');
        option.text = h.name;
        select.add(option);
    });

    map = L.map('map').setView([29.995, 31.172], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // تقدر تدوس على الخريطة برضو
    map.on('click', function(e){
        calcAndDraw(e.latlng.lat, e.latlng.lng);
    });
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI / 180;
    const dLon = (lon2-lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function clearAll(){
    drawnItems.forEach(l => map.removeLayer(l));
    drawnItems = [];
    if(incidentMarker) map.removeLayer(incidentMarker);
    document.getElementById('result').style.display = "none";
    lastRouteLink = "";
}

function searchAddress(){
let address = document.getElementById('address').value;
if(address.trim() == ""){ alert("اكتب عنوان البلاغ"); return; }

document.getElementById('result').style.display = "block";
document.getElementById('result').innerHTML = "جاري البحث عن العنوان...";

fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ", الجيزة, مصر")}`)
.then(res => res.json())
.then(data => {
    if(data.length == 0){ alert("العنوان مش واضح \n جرب: شارع الهرم الطالبية الجيزة"); return; }
    calcAndDraw(parseFloat(data[0].lat), parseFloat(data[0].lon));
}).catch(err => alert("اتأكد من النت"));
}

function calcAndDraw(addrLat, addrLng){
    clearAll();
    incidentLat = addrLat; incidentLng = addrLng;

    incidentMarker = L.marker([addrLat, addrLng], {icon: incidentIcon}).addTo(map).bindPopup("🔥 مكان البلاغ").openPopup();
    drawnItems.push(incidentMarker);
    map.setView([addrLat, addrLng], 13);

    let promises = hydrants.map(h =>
        fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(h.name + ", الجيزة, مصر")}`)
       .then(res => res.json())
       .then(data => {
            if(data.length > 0){
                h.lat = parseFloat(data[0].lat);
                h.lng = parseFloat(data[0].lon);
                h.distance = getDistance(addrLat, addrLng, h.lat, h.lng);
                L.marker([h.lat, h.lng], {icon: hydrantIcon}).addTo(map).bindPopup(`<b>🧯 ${h.name}</b>`);
            }
        }).catch(()=>{})
    );

    Promise.all(promises).then(() => {
        let valid = hydrants.filter(h => h.lat && h.distance);
        valid.sort((a,b) => a.distance - b.distance);
        let nearest = valid.slice(0,3);

        let html = `<b>اقرب 3 نقاط اطفاء:</b><br>`;
        nearest.forEach((h, i) => {
            let time = Math.round((h.distance / 40) * 60);
            let line = L.polyline([[addrLat, addrLng], [h.lat, h.lng]], {color: 'red', weight: 4, dashArray: '10,10'}).addTo(map);
            drawnItems.push(line);
            let midLat = (addrLat + h.lat) / 2;
            let midLng = (addrLng + h.lng) / 2;
            let label = L.marker([midLat, midLng], {
                icon: L.divIcon({className: 'distance-label', html: `${h.distance.toFixed(1)} كم`})
            }).addTo(map);
            drawnItems.push(label);
            L.circleMarker([h.lat, h.lng], {color:'green', radius:14, fillOpacity:0.9}).addTo(map);
            html += `${i+1}. ${h.name} - ${h.distance.toFixed(1)} كم - ${time} دقيقة<br>`;
        });
        document.getElementById('result').innerHTML = html;

        let waypoints = nearest.map(h => `${h.lat},${h.lng}`).join('|');
        lastRouteLink = `https://www.google.com/maps/dir/?api=1&origin=${addrLat},${addrLng}&destination=${addrLat},${addrLng}&waypoints=${waypoints}`;
    });
}

function showRoute(){
if(lastRouteLink == ""){ alert("حدد مكان البلاغ الاول من الخانة او الخريطة"); return; }
window.location.href = lastRouteLink;
}

function showAllHydrants(){
    map.setView([29.995, 31.172], 10);
}

function shareWhatsApp(){
if(lastRouteLink == ""){ alert("حدد مكان البلاغ الاول"); return; }
let text = "بلاغ مطافي 🚒\nنقطة الاطفاء: " + document.getElementById('management').value + "\nعنوان البلاغ: " + document.getElementById('address').value + "\nالمسار: " + lastRouteLink;
window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
}
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
